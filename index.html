<style>

}

.slist, .seclist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sbtn { width: 100%; text-align: left; font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 9px 12px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; min-height: 42px; }

.btn { font: inherit; font-weight: 700; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; min-height: 36px; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 0.8rem; }

.mini.danger { color: var(--danger); }
.box { font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); padding: 8px; resize: vertical; }
.fld { font: inherit; font-size: 0.85rem; width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); padding: 7px; min-height: 36px; }

.scgrid { display: grid; grid-template-columns: 55px minmax(0,1fr) 55px; gap: 6px; align-items: center; }
.scgrid .h { font-size: 0.74rem; font-weight: 700; color: var(--muted); }
.scgrid .full { grid-column: 1/-1; margin-bottom: 6px; }
.status { margin: 0; font-size: 0.76rem; color: var(--muted); }

.toolbar { max-width: 900px; margin: 0 auto 12px; display: flex; flex-wrap: wrap; gap: 7px; align-items: center; justify-content: space-between; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.toolbar p { margin: 0; font-size: 0.82rem; color: var(--muted); flex: 1 1 180px; }

.colorpick, .paperpick { display: inline-flex; align-items: center; gap: 5px; font-size: 0.78rem; font-weight: 700; background: var(--bg); padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); min-height: 36px; }
.colorpick input { width: 24px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: #fff; cursor: pointer; }
.paperpick select { font: inherit; font-weight: 700; border: 0; background: transparent; color: var(--fg); cursor: pointer; outline: none; }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; }
.segb { font: inherit; font-weight: 700; font-size: 0.8rem; border: 0; background: transparent; color: var(--muted); padding: 6px 9px; border-radius: 6px; cursor: pointer; min-height: 32px; }
.segb[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }

.nilai { max-width: 900px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.tblwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.ntbl { border-collapse: collapse; width: 100%; font-size: 0.85rem; min-width: 600px; }
.ntbl th, .ntbl td { padding: 6px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; }
.ntbl thead th { font-size: 0.72rem; color: var(--muted); font-weight: 700; }

.nin { width: 52px; height: 36px; text-align: center; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
.cabbr { display: block; font-size: 0.7rem; font-weight: 700; color: var(--muted); }
.cnt { font-size: 0.8rem; color: var(--muted); }
.linkbtn { font: inherit; font-weight: 700; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-align: left; }

/* Halaman Raport Dokumen — Ukuran Seragam Semua Lembar */
.sheets { display: flex; flex-direction: column; gap: 22px; max-width: 900px; margin: 0 auto; align-items: center; }
.page {
  position: relative;
  width: 100%;
  max-width: 820px;
  min-height: 1120px;
  background: var(--paper);
  color: #000;
  padding: clamp(20px, 4vw, 38px);
  border-radius: 12px;
  border: 1px solid #dce6e2;
  box-shadow: 0 4px 18px rgba(0,0,0,.06);

  gap: 14px;

}
body.paper-f4 .page { min-height: 1245px; }

.page:not(.cover)::before { content: ""; position: absolute; left: 0; top: 0; width: 6px; height: 100%; background: linear-gradient(180deg, var(--p-accent), #d8b56b); border-radius: 12px 0 0 12px; }

.runhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; font-size: 0.76rem; color: var(--ink-muted); border-bottom: 2px solid var(--p-accent); padding-bottom: 6px; }
.pgno { font-size: 0.74rem; color: var(--ink-muted); text-align: center; margin-top: auto; padding-top: 8px; border-top: 1px solid #e1e9e5; }
.h3 { font: 700 1.08rem var(--f-display); color: var(--p-accent); margin: 0; }
.sub { font-size: 0.84rem; color: var(--ink-muted); margin: 0; }

/* Rich Editable Element — Semua kata/kalimat bisa diedit & ditebalkan per bagian */
.ed {
  font: inherit;
  color: inherit;
  background: transparent;
  border: 0;
  border-bottom: 1px dashed var(--rule);
  border-radius: 0;
  padding: 2px 3px;
  min-width: 24px;
  outline: none;
  display: inline-block;
  word-break: break-word;
}
.ed.block { display: block; width: 100%; }
.ed.box-area {
  display: block;
  width: 100%;

  border-radius: 6px;
  padding: 8px 10px;
  min-height: 68px;
  line-height: 1.6;
  white-space: pre-wrap;
}
.ed:focus { background: rgba(23,118,106,.07); border-bottom-color: var(--p-accent); }

  content: attr(data-placeholder);

.cover-photo-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; margin: 4px 0; }

/* Pengesahan, Tanda Tangan (TTD) & Stempel Transparan Draggable */

.stamp-overlay {

  user-select: none;
  touch-action: none;

  flex-direction: column;

.stamp-box-ui {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;

  padding: 2px;
}
.stamp-graphic {
  width: 100%;
  height: 100%;
  mix-blend-mode: multiply; /* Efek tinta stempel asli tembus pandang di atas TTD */
  pointer-events: none;
}
.stamp-mini-bar {
  position: absolute;
  top: -28px;
  left: 50%;
  transform: translateX(-50%);
  background: #1b2b2a;
  color: #fff;
  border-radius: 6px;
  padding: 2px 6px;
  display: none;
  gap: 4px;
  white-space: nowrap;
  font-size: 0.68rem;
  box-shadow: 0 3px 8px rgba(0,0,0,0.25);

.stamp-overlay:hover .stamp-mini-bar,
.stamp-overlay.selected .stamp-mini-bar {
  display: flex;
}
.stamp-mini-bar button {

  border: 0;

  font-weight: 700;

function praiseSentence(key){var x=PRAISE.find(function(a){return a[0]===key});return x?x[2]:''}
function callName(s){var p=plainText(s.panggilan),n=plainText(s.nama);return p||(n.split(/\s+/)[0])||'Ananda'}
function tplB(blk,lv,nama){
  var t=T[blk.id];
  var cap=(t&&t[lv])?t[lv]:GEN[lv].replace('%t',(plainText(blk.title)||'ini').toLowerCase());
  var sar=t?t.saran:'';
  return (cap+(sar?' '+sar:'')).replace(/\{nama\}/g,nama);
}
function getS(s,id){return s.sc[id]||(s.sc[id]={num:'',level:''})}
function getB(s,id){return s.bn[id]||(s.bn[id]={text:'',auto:false})}
function blockLevel(s,blk,sc){
  var t=0,c=0;
  (blk.from||[]).forEach(function(id){var x=parseNum((s.sc[id]||{}).num);if(x!==null){t+=x;c++}});
  return c?levelFor(t/c,sc):'';
}
function regenB(s,blk,sc){
  var b=getB(s,blk.id);
  if(b.auto||!plainText(b.text)){b.text=tplB(blk,blockLevel(s,blk,sc)||'l2',callName(s));b.auto=true}
}
function regenBlocksFor(s,secId){D.blocks.forEach(function(blk){if((blk.from||[]).indexOf(secId)>-1)regenB(s,blk)})}
function setNum(s,secId,raw){
  var r=getS(s,secId);
  var x=parseNum(raw),norm=raw;
  if(x!==null&&parseFloat(String(raw).replace(/<[^>]*>/g,'').replace(',','.'))>100)norm='100';
  r.num=norm;
  if(x!==null){r.level=levelFor(x);regenBlocksFor(s,secId)}
  recalcRanks();refreshRanks();
  return norm;
}

/* ===== Kalkulasi Nilai, Rata-rata, Peringkat & Juara Per Kelas (Miss Laila & Miss Farida terpisah) ===== */
function fmt2(x){return String(Math.round(x*100)/100).replace('.',',')}
function avgOf(s){
  var t=0,c=0;
  D.sections.forEach(function(sec){var x=parseNum(((s.sc||{})[sec.id]||{}).num);if(x!==null){t+=x;c++}});
  return c?{total:t,avg:t/c,count:c}:null;
}
function rankInfo(s){
  var a=avgOf(s);if(!a)return null;
  var kl=plainText(s.kelas||'Kelas Miss Laila'),key=Math.round(a.avg*100),r=1,n=0;
  D.students.forEach(function(x){
    if(plainText(x.kelas||'Kelas Miss Laila')!==kl)return;
    var ax=avgOf(x);if(!ax)return;
    n++;if(Math.round(ax.avg*100)>key)r++;
  });
  return {rank:r,n:n,avg:a.avg,total:a.total,count:a.count,kelas:kl};
}
function rankLabel(r){return r<=3?'Juara '+r:'Peringkat '+r}
function juaraText(s,ri){
  var nm=plainText(s.nama)||'Ananda',kl=ri.kelas||'kelas';
  if(ri.rank<=3)return nm+' meraih '+rankLabel(ri.rank)+' di '+kl+' dengan nilai rata-rata '+fmt2(ri.avg)+' dari '+ri.n+' anak. Selamat dan terus semangat belajar!';
  return nm+' berada pada peringkat '+ri.rank+' dari '+ri.n+' anak di '+kl+' dengan nilai rata-rata '+fmt2(ri.avg)+'. Terus semangat dan tingkatkan prestasinya!';
}
function recalcRanks(){
  D.students.forEach(function(s){
    var ri=rankInfo(s);
    if(s.rankAuto!==false)s.peringkat=ri?rankLabel(ri.rank):'';
    if(s.juaraAuto!==false)s.juara=ri?esc(juaraText(s,ri)):'';
  });
}
function summaryTexts(s){
  var ri=rankInfo(s);
  if(!ri)return {total:'–',avg:'–',rank:'Belum ada nilai',ket:'Isi nilai untuk melihat rata-rata dan peringkat.'};
  var lv=levelFor(ri.avg);
  return {
    total:fmt2(ri.total)+' (dari '+ri.count+' bidang)',
    avg:fmt2(ri.avg)+' · '+abbrOf(lv)+' ('+labelOf(lv)+')',
    rank:rankLabel(ri.rank)+' dari '+ri.n+' anak ('+ri.kelas+')',
    ket:plainText(s.juara)
  };
}
function refreshRanks(){
  var s=cur(),m=summaryTexts(s),e;
  if((e=$('#sumTotal')))e.textContent=m.total;
  if((e=$('#sumAvg')))e.textContent=m.avg;
  if((e=$('#sumRank')))e.textContent=m.rank;
  if((e=$('#sumKet')))e.textContent=m.ket;
  document.querySelectorAll('[data-p="s.peringkat"]').forEach(function(el){if(document.activeElement!==el)el.innerHTML=s.peringkat||''});
  document.querySelectorAll('[data-p="s.juara"]').forEach(function(el){if(document.activeElement!==el)el.innerHTML=s.juara||''});
  D.students.forEach(function(st){
    var ri=rankInfo(st),a=$('#avg-'+st.id),r=$('#rk-'+st.id);
    if(a)a.textContent=ri?fmt2(ri.avg):'–';
    if(r)r.textContent=ri?rankLabel(ri.rank):'–';
  });
}

function pushToCloudDatabase(silent){
  var url = (D.adminSystem && D.adminSystem.cloudUrl || '').trim();
  if(!url){
    if(!silent) setStatus('Masukkan URL Google Apps Script / Cloud Database terlebih dahulu.');
    return;
  }
  var dot = $('#syncDot');
  if(dot) dot.classList.add('busy');
  fetch(url, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: 'sync_eraport',
      cacheVersion: D.adminSystem.cacheVersion,
      updatedAt: new Date().toISOString(),
      data: D
    })
  }).then(function(){
    D.adminSystem.lastSyncTime = new Date().toLocaleString('id-ID');
    try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){}
    if(dot) dot.classList.remove('busy');
    setStatus('Cloud Database & Auto Sync berhasil (' + D.adminSystem.lastSyncTime + ').');
    if(ui.view === 'admin') renderAdminDashboard();
  }).catch(function(){
    if(dot) dot.classList.remove('busy');
    setStatus('Gagal terhubung ke Cloud Database. Periksa koneksi internet.');
  });
}

function pullFromCloudDatabase(){
  var url = (D.adminSystem && D.adminSystem.cloudUrl || '').trim();
  if(!url){
    alert('Silakan isi URL Cloud Database (Google Apps Script) terlebih dahulu.');
    return;
  }
  setStatus('Mengambil data terbaru dari Cloud Database...');
  fetch(url + (url.indexOf('?')>-1?'&':'?') + 't=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res && res.data && valid(res.data)){
        createVersionSnapshot('Sebelum tarik data dari Cloud');
        D = res.data;
        D.adminSystem.lastSyncTime = new Date().toLocaleString('id-ID');
        localStorage.setItem(KEY, JSON.stringify(D));
        renderAll();
        setStatus('Sinkronisasi dari Cloud Database selesai!');
      } else {
        setStatus('Cloud Database terhubung, belum ada paket backup penuh di server.');
      }
    }).catch(function(){
      setStatus('Tidak dapat menarik data JSON dari URL tersebut.');
    });
}

function save(forceManual){
  if(!forceManual && D.adminSystem && D.adminSystem.autoSave === false){
    setStatus('Auto Save nonaktif. Klik "Simpan Manual" di Admin Dashboard untuk menyimpan.');
    return;
  }
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{
      localStorage.setItem(KEY,JSON.stringify(D));
      if(syncChannel && D.adminSystem && D.adminSystem.realTimeUpdate){
        syncChannel.postMessage({ type: 'REALTIME_UPDATE', ts: Date.now() });
      }
      if(D.adminSystem && D.adminSystem.autoSync && D.adminSystem.cloudUrl){
        pushToCloudDatabase(true);
      } else {
        setStatus('Auto Save aktif: Perubahan tersimpan otomatis (' + new Date().toLocaleTimeString('id-ID') + ').');
      }
    }
    catch(e){setStatus('Peringatan: Memori penuh (ukuran gambar terlalu besar).')}
  },350);
}

function renderNilai(){
  var listSt=filteredStudents();
  var kOpts=[['Kelas Miss Laila','Kelas Miss Laila'],['Kelas Miss Farida','Kelas Miss Farida'],['SEMUA','Semua Kelas']].map(function(k){
    return '<button type="button" class="segb" data-act="filterKelas" data-kelas="'+k[0]+'" aria-selected="'+(ui.kelasFilter===k[0])+'">'+k[1]+'</button>';
  }).join('');
  var head='<tr><th scope="col">Siswa</th><th scope="col">Kelas</th>'+D.sections.map(function(sec){return '<th scope="col">'+esc(plainText(sec.title))+'</th>'}).join('')+'<th scope="col">Rata-rata</th><th scope="col">Peringkat</th><th scope="col">Terisi</th></tr>';
  var rows=listSt.map(function(s){
    return '<tr data-sid="'+s.id+'"><th scope="row"><button class="linkbtn" data-act="open" data-id="'+s.id+'">'+esc(plainText(s.nama)||'(tanpa nama)')+'</button></th>'+
      '<td>'+esc(plainText(s.kelas||'Kelas Miss Laila'))+'</td>'+
      D.sections.map(function(sec){
        var r=s.sc[sec.id]||{};
        return '<td><input class="nin" id="n-'+s.id+'-'+sec.id+'" data-nsid="'+s.id+'" data-sec="'+sec.id+'" value="'+esc(plainText(r.num))+'" inputmode="decimal" placeholder="–"><span class="cabbr">'+esc(abbrOf(r.level))+'</span></td>';
      }).join('')+(function(){var ri=rankInfo(s);return '<td><b id="avg-'+s.id+'">'+(ri?fmt2(ri.avg):'–')+'</b></td><td><b id="rk-'+s.id+'">'+(ri?rankLabel(ri.rank):'–')+'</b></td>'})()+'<td class="cnt">'+scored(s)+'/'+D.sections.length+'</td></tr>';
  }).join('');
  $('#paperwrap').innerHTML='<div class="nilai no-print"><div class="seg" style="align-self:flex-start">'+kOpts+'</div><div class="tblwrap"><table class="ntbl"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>'+
    '<p class="hint">'+legendText()+'</p></div>';
}

  setStatus('File Excel (.csv) berhasil diunduh.');

function parseCSVLine(line,sep){
  var res=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){
      if(inQ&&line[i+1]==='"'){cur+='"';i++}
      else inQ=!inQ;
    }else if(c===sep&&!inQ){res.push(cur);cur=''}
    else cur+=c;
  }
  res.push(cur);
  return res;
}

function handleExcelImport(text){
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim()});
  if(lines.length<2){alert('File CSV kosong atau format tidak sesuai.');return}
  var sep=lines[0].indexOf(';')>-1?';':',';
  var hdr=parseCSVLine(lines[0],sep);
  var hasKelas=hdr[7]&&hdr[7].toLowerCase().indexOf('kelas')>-1;
  var off=hasKelas?1:0;
  var imported=[];
  for(var i=1;i<lines.length;i++){
    var cols=parseCSVLine(lines[i],sep);
    if(!cols[0]||!cols[0].trim())continue;
    var s=newStudent({
      nama:cols[0]||'',panggilan:cols[1]||(cols[0]||'').split(' ')[0],
      nik:cols[2]||'',nisn:cols[3]||'',jk:cols[4]||'',ttl:cols[5]||'',
      agama:cols[6]||'',
      kelas:hasKelas?(cols[7]||'Kelas Miss Laila'):(ui.kelasFilter==='SEMUA'?'Kelas Miss Laila':ui.kelasFilter),
      rombel:cols[7+off]||'Rombel B',ortu:cols[8+off]||'',
      tb:cols[9+off]||'',bb:cols[10+off]||'',lk:cols[11+off]||'',
      sakit:cols[12+off]||'0',izin:cols[13+off]||'0',alpa:cols[14+off]||'0'
    });
    D.sections.forEach(function(sec,idx){
      var valStr=cols[15+off+idx];
      if(valStr!==undefined&&valStr!==''){
        var num=parseNum(valStr);
        if(num!==null)s.sc[sec.id]={num:String(num),level:levelFor(num)};
      }
    });
    s.peringkat=cols[15+off+D.sections.length]||'';
    s.juara=cols[16+off+D.sections.length]||'';
    D.blocks.forEach(function(blk){regenB(s,blk)});
    imported.push(s);
  }
  if(imported.length){
    D.students=imported;
    D.cur=imported[0].id;
    renderAll();save();
    setStatus('Berhasil mengimpor '+imported.length+' data siswa dari Excel.');
  }
}

function syncPath(p,src){
  var htmlVal = src.isContentEditable ? src.innerHTML : src.value;
  document.querySelectorAll('[data-p="'+p+'"]').forEach(function(el){
    if(el!==src){
      if(el.isContentEditable) el.innerHTML = htmlVal;
      else el.value = htmlVal;
    }
  });
}

document.addEventListener('input',function(e){
  var t=e.target,ds=t.dataset||{};
  var valStr = t.isContentEditable ? t.innerHTML : t.value;

  if(ds.p){
    setv(ds.p, valStr);
    syncPath(ds.p, t);
    if(ds.p==='s.peringkat')cur().rankAuto=false;
    if(ds.p==='s.juara')cur().juaraAuto=false;
    if(ds.p==='s.nama'||ds.p==='s.rombel'||ds.p==='s.kelas'){recalcRanks();refreshRanks()}
    if((ds.p==='s.nama'||ds.p==='s.rombel'||ds.p==='s.kelas'||ds.p==='school.npsn')&&ui.tab==='siswa') renderPanel();
  }else if(ds.stamp){
    D.school[ds.stamp] = t.value;
    renderPaper();
  }else if(ds.scale!=null){
    var k=sk(ds.scale);if(!k)return;
    if(ds.f==='min'){var v=parseFloat(String(t.value).replace(',','.'));k.min=isNaN(v)?0:v}else k[ds.f]=t.value;
    renderMain();save();return;
  }else if(ds.nsid){
    var st=D.students.find(function(x){return x.id===ds.nsid});if(!st)return;
    var norm=setNum(st,ds.sec,t.value);
    if(norm!==t.value)t.value=norm;
    var ab=t.nextElementSibling;if(ab)ab.textContent=abbrOf(getS(st,ds.sec).level);
    save();return;
  }else if(ds.blk){
    var blk=D.blocks.find(function(x){return x.id===ds.blk});if(!blk)return;
    if(ds.f==='title'){blk.title=valStr;if(ui.tab==='bidang')renderPanel()}
    else{var b=getB(cur(),blk.id);b.text=valStr;b.auto=false}
  }else if(ds.sec){
    var sec=D.sections.find(function(x){return x.id===ds.sec});if(!sec)return;
    var f=ds.f,s=cur();
    if(f==='title'||f==='cp'){sec[f]=valStr;if(f==='title'&&ui.tab==='bidang')renderPanel()}
    else if(f==='num'){
      setNum(s,sec.id,plainText(valStr));
      refreshRow(sec.id);
    }else if(f==='level'){
      getS(s,sec.id).level=t.value;refreshRow(sec.id);
    }
  }else return;
  save();
});

var dragState = null;
document.addEventListener('pointerdown', function(e){
  var stEl = e.target.closest('.stamp-overlay');
  if(!stEl || e.target.tagName === 'BUTTON') return;
  e.preventDefault();
  document.querySelectorAll('.stamp-overlay').forEach(function(el){ el.classList.remove('selected'); });
  stEl.classList.add('selected');
  var pageEl = stEl.closest('.page');
  var rect = stEl.getBoundingClientRect();
  dragState = {
    el: stEl,
    pageEl: pageEl,
    id: stEl.dataset.stampId,
    offsetX: e.clientX - rect.left,
    offsetY: e.clientY - rect.top
  };
});

document.addEventListener('pointermove', function(e){
  if(!dragState) return;
  var pRect = dragState.pageEl.getBoundingClientRect();
  var nx = Math.round(e.clientX - pRect.left - dragState.offsetX);
  var ny = Math.round(e.clientY - pRect.top - dragState.offsetY);
  nx = Math.max(-20, Math.min(pRect.width - 40, nx));
  ny = Math.max(-20, Math.min(pRect.height - 40, ny));
  dragState.el.style.left = nx + 'px';
  dragState.el.style.top = ny + 'px';
  dragState.lastX = nx;
  dragState.lastY = ny;
});

document.addEventListener('pointerup', function(){
  if(!dragState) return;
  if(dragState.lastX !== undefined){
    if(dragState.id === 'main'){
      D.school.stampPos.x = dragState.lastX;
      D.school.stampPos.y = dragState.lastY;
    } else {
      var found = (D.school.extraStamps||[]).find(function(x){ return x.id === dragState.id; });
      if(found){ found.x = dragState.lastX; found.y = dragState.lastY; }
    }
    save();
  }
  dragState = null;
});

function moveItem(list,id,dir){
  var idx=list.findIndex(function(x){return x.id===id});
  if(idx<0)return;
  var nidx=idx+dir;
  if(nidx<0||nidx>=list.length)return;
  var tmp=list[idx];list[idx]=list[nidx];list[nidx]=tmp;
}

      D.school.stampPlaced = false;
      renderPaper();save();break;
    case 'delExtraStamp':
      D.school.extraStamps = (D.school.extraStamps||[]).filter(function(x){ return x.id !== id; });
      renderPaper();save();break;
    case 'addSnippet':
      var target=b.dataset.target;
      var noteBox=b.parentElement.parentElement.querySelector('[data-p="s.'+target+'"]');
      var snippetSelect=b.parentElement.querySelector('.snippet-select');
      var snippets=PAGE_SNIPPETS[target]||[];
      var chosen=snippetSelect&&snippetSelect.value!==''?snippets[Number(snippetSelect.value)]:'';
      if(chosen&&noteBox){
        var current=noteBox.innerHTML.trim();
        noteBox.innerHTML=current?(current+'<br><br>'+esc(chosen)):esc(chosen);
        noteBox.dispatchEvent(new Event('input',{bubbles:true}));
        save();
      }
      break;
    case 'addPraise':
      var praiseSel=b.parentElement.querySelector('.praise-select');
      var praise=praiseSentence(praiseSel&&praiseSel.value);
      if(praise){
        var praiseData=getB(s,id);var praiseText=praise.replace(/^Ananda/,callName(s));
        if(praiseData.text.indexOf(praiseText)<0){
          praiseData.text=(praiseData.text.trim()?praiseData.text.trim()+' ':'')+esc(praiseText);
          praiseData.auto=false;refreshBlocks();save();
        }
      }
      break;
    case 'tpl':
      var blk=D.blocks.find(function(x){return x.id===id});if(!blk)return;
      var bb=getB(s,id);
      bb.text=tplB(blk,blockLevel(s,blk)||'l2',callName(s));bb.auto=true;
      refreshBlocks();save();break;
    case 'fillAll':
      D.blocks.forEach(function(blk2){var m=getB(s,blk2.id);if(!plainText(m.text)){m.auto=false;regenB(s,blk2)}});
      refreshBlocks();save();break;
    case 'pdf':window.print();break;
    case 'word':exportToWord();break;
    case 'exportExcel':exportToExcel();break;
    case 'importExcel':$('#excelImportInput').click();break;
    case 'copy':
      var exp=$('#exp');if(exp){exp.select();document.execCommand('copy');setStatus('Cadangan JSON disalin ke clipboard.')}
      break;
    case 'restore':
      try{
        var parsed=JSON.parse($('#imp').value);
        if(valid(parsed)){D=parsed;ui.confirm=null;renderAll();save();setStatus('Data berhasil dipulihkan.')}
        else alert('Format cadangan tidak valid.');
      }catch(err){alert('Gagal membaca teks cadangan JSON.')}
      break;
    case 'syncNowCloud':
      pushToCloudDatabase(false);
      break;
    case 'pullCloud':
      pullFromCloudDatabase();
      break;
    case 'manualSaveNow':
      save(true);
      break;
    case 'refreshCache':
      var nextV = 'v2026.11.21-' + Math.floor(100 + Math.random()*900);
      D.adminSystem.cacheVersion = nextV;
      save(true);
      renderAdminDashboard();
      setStatus('Cache Control diperbarui ke versi ' + nextV + '. Tampilan versi lama dibersihkan.');
      break;
    case 'addSoal':
      D.adminSystem.soalBank.push({
        id: uid(),
        kelas: 'Kelas Miss Laila',
        bidang: 'Agama dan spiritual',
        tanya: 'Pertanyaan evaluasi baru...',
        a: 'Pilihan jawaban A',
        b: 'Pilihan jawaban B',
        c: 'Pilihan jawaban C',
        kunci: 'A',
        skor: 100
      });
      renderAdminDashboard();
      save();
      break;
    case 'delSoal':
      D.adminSystem.soalBank = D.adminSystem.soalBank.filter(function(q){ return q.id !== id; });
      renderAdminDashboard();
      save();
      break;
    case 'addUser':
      var uName = ($('#newUserName').value||'').trim();
      var uRole = $('#newUserRole').value;
      var uPin = ($('#newUserPin').value||'').trim();
      if(!uName || uPin.length < 4){ alert('Isi nama pengguna dan PIN minimal 4 digit!'); return; }
      D.adminSystem.users.push({ id: uid(), name: uName, role: uRole, pin: uPin, status: 'Aktif' });
      renderAdminDashboard();
      save();
      break;
    case 'toggleUserStatus':
      var targetU = D.adminSystem.users.find(function(u){ return u.id === id; });
      if(targetU){
        targetU.status = targetU.status === 'Aktif' ? 'Nonaktif' : 'Aktif';
        renderAdminDashboard();
        save();
      }
      break;
    case 'delUser':
      D.adminSystem.users = D.adminSystem.users.filter(function(u){ return u.id !== id; });
      renderAdminDashboard();
      save();
      break;
    case 'saveVersionNow':
      var noteV = prompt('Masukkan keterangan titik versi (misal: Sebelum Edit Nilai Semester I):', 'Backup Sebelum Perubahan');
      if(noteV !== null){
        createVersionSnapshot(noteV || 'Titik Versi Manual');
        renderAdminDashboard();
        save(true);
        setStatus('Riwayat versi berhasil disimpan.');
      }
      break;
    case 'restoreVersion':
      var verObj = (D.adminSystem.versions||[]).find(function(v){ return v.id === id; });
      if(verObj && confirm('Pulihkan data ke versi "' + verObj.note + '" (' + verObj.time + ')?')){
        try{
          var pData = JSON.parse(verObj.payload);
          if(pData.school) D.school = pData.school;
          if(pData.scale) D.scale = pData.scale;
          if(pData.sections) D.sections = pData.sections;
          if(pData.blocks) D.blocks = pData.blocks;
          if(pData.students) D.students = pData.students;
          if(pData.soalBank) D.adminSystem.soalBank = pData.soalBank;
          renderAll();
          save(true);
          setStatus('Data berhasil dipulihkan dari Version Control.');
        }catch(err){ alert('Gagal memulihkan versi.'); }
      }
      break;
    case 'downloadBackupFile':
      var bBlob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
      var bUrl = URL.createObjectURL(bBlob);
      var bA = document.createElement('a');
      bA.href = bUrl;
      bA.download = 'Backup_Database_eRaport_TK_Mutiara_Harapan.json';
      bA.click();
      URL.revokeObjectURL(bUrl);
      setStatus('Backup Database (.JSON) berhasil diunduh.');
      break;
    case 'reset':
      if(ui.confirm!=='reset:'){ui.confirm='reset:';renderPanel();break}
      localStorage.removeItem(KEY);
      D=seed();ui.confirm=null;renderAll();save();setStatus('Data dikembalikan ke pengaturan awal.');
      break;
  }
});

document.addEventListener('dblclick', function(e){
  var pageEl = e.target.closest('.page');
  if(!pageEl || e.target.isContentEditable) return;
  var pNum = Number(pageEl.dataset.page);
  var rect = pageEl.getBoundingClientRect();
  var sz = D.school.stampSize || 105;
  var nx = Math.round(e.clientX - rect.left - sz/2);
  var ny = Math.round(e.clientY - rect.top - sz/2);
  D.school.extraStamps.push({ id: uid(), page: pNum, x: nx, y: ny });
  renderPaper();save();
  setStatus('Stempel ditempel pada Halaman ' + pNum + '. Geser untuk menyesuaikan posisi.');
});

function handleImageUpload(file,maxW,callback){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var scale=Math.min(1,maxW/img.width);
      canvas.width=img.width*scale;
      canvas.height=img.height*scale;
      var ctx=canvas.getContext('2d');
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      callback(canvas.toDataURL('image/png'));
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

document.addEventListener('input', function(e){
  if(e.target.id === 'ttdGuruSlider'){
    D.school.ttdGuruScale = Number(e.target.value);
    renderPaper();save();
  } else if(e.target.id === 'ttdKepsekSlider'){
    D.school.ttdKepsekScale = Number(e.target.value);
    renderPaper();save();
  } else if(e.target.id === 'stampSizeSlider'){
    D.school.stampSize = Number(e.target.value);
    renderPaper();save();
  } else if(e.target.id === 'stampOpacitySlider'){
    D.school.stampOpacity = Number(e.target.value)/100;
    renderPaper();save();
  } else if(e.target.id === 'stampColorPick'){
    D.school.stampColor = e.target.value;
    renderPaper();save();
  } else if(e.target.id === 'adminCloudUrl'){
    D.adminSystem.cloudUrl = e.target.value;
    save();
  } else if(e.target.dataset && e.target.dataset.soalId){
    var sq = (D.adminSystem.soalBank||[]).find(function(x){ return x.id === e.target.dataset.soalId; });
    if(sq){
      sq[e.target.dataset.sf] = e.target.value;
      save();
    }
  }
});

document.addEventListener('change',function(e){
  if(e.target.id==='themeColor'){
    D.school.accent=e.target.value;
    document.documentElement.style.setProperty('--p-accent',e.target.value);
    renderMain();save();
  }else if(e.target.id==='paperSizeSel'){
    D.school.paperSize=e.target.value;
    applyPaperSize();save();
  }else if(e.target.id==='logoInput'){
    handleImageUpload(e.target.files[0],300,function(dataUrl){ D.school.logo=dataUrl;renderAll();save(); });
    e.target.value='';
  }else if(e.target.id==='photoInput'){
    handleImageUpload(e.target.files[0],350,function(dataUrl){ cur().foto=dataUrl;renderPaper();save(); });
    e.target.value='';
  }else if(e.target.id==='ttdGuruInput'){
    handleImageUpload(e.target.files[0],400,function(dataUrl){ D.school.ttdGuru=dataUrl;renderAll();save(); });
    e.target.value='';
  }else if(e.target.id==='ttdKepsekInput'){
    handleImageUpload(e.target.files[0],400,function(dataUrl){ D.school.ttdKepsek=dataUrl;renderAll();save(); });
    e.target.value='';
  }else if(e.target.id==='stampImgInput'){
    handleImageUpload(e.target.files[0],400,function(dataUrl){ D.school.stampImg=dataUrl;renderAll();save(); });
    e.target.value='';
  }else if(e.target.id==='chkAutoSync'){
    D.adminSystem.autoSync = e.target.checked;
    renderAdminDashboard();save(true);
  }else if(e.target.id==='chkRealTime'){
    D.adminSystem.realTimeUpdate = e.target.checked;
    renderAdminDashboard();save(true);
  }else if(e.target.id==='chkAutoSave'){
    D.adminSystem.autoSave = e.target.checked;
    renderAdminDashboard();save(true);
  }else if(e.target.dataset && e.target.dataset.soalId){
    var sq2 = (D.adminSystem.soalBank||[]).find(function(x){ return x.id === e.target.dataset.soalId; });
    if(sq2){
      sq2[e.target.dataset.sf] = e.target.value;
      save();
    }
  }else if(e.target.id==='excelImportInput'){
    var f=e.target.files[0];
    if(f){
      var r=new FileReader();
      r.onload=function(ev){handleExcelImport(ev.target.result)};
      r.readAsText(f);
    }
    e.target.value='';
  }
});

renderAll();
$('#pinInput').focus();
})();
</script>
